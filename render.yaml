services:
  # GitDigest - Resumo Inteligente & Auditoria de Modificações no GitHub em PDF
  - type: web
    name: repo-change-summary
    runtime: static
    plan: free
    region: oregon
    branch: main
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /*
        name: Cache-Control
        value: no-cache
